
services:
  einklab:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - frontend_env
    image: einklab:latest
    pull_policy: build
    container_name: einklab
    restart: unless-stopped
    init: true

    mem_limit: 384m
    cpus: 1.0

    volumes:
      - /opt/docker/einklab/app/backend/.env.prod:/app/backend/.env.prod:ro
      - /opt/docker/einklab/media:/app/backend/media

    networks:
      - proxy
      - database

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.einklab.rule=Host(`sapinon.com`) || Host(`www.sapinon.com`) || Host(`api.sapinon.com`) || Host(`screensaver.sapinon.com`) || Host(`firmware.sapinon.com`) || Host(`xteink.sapinon.com`)"
      - "traefik.http.routers.einklab.entrypoints=websecure"
      - "traefik.http.routers.einklab.tls=true"
      - "traefik.http.routers.einklab.tls.certresolver=le"
      - "traefik.http.routers.einklab.tls.domains[0].main=sapinon.com"
      - "traefik.http.routers.einklab.tls.domains[0].sans=www.sapinon.com,api.sapinon.com,screensaver.sapinon.com,firmware.sapinon.com,xteink.sapinon.com"
      - "traefik.http.services.einklab.loadbalancer.server.port=8000"

secrets:
  frontend_env:
    file: /opt/docker/einklab/app/frontend/.env.prod

networks:
  proxy:
    external: true
  database:
    external: true
